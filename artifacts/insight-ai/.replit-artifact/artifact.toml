kind = "web"
previewPath = "/"
title = "InsightAI — AI Analytics Dashboard"
version = "1.0.0"
id = "artifacts/insight-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23334

[services.development]
run = "pnpm --filter @workspace/insight-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/insight-ai", "run", "build" ]
publicDir = "artifacts/insight-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23334"
BASE_PATH = "/"
